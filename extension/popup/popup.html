<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Booking Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- Past booking modal — blocks the extension until the agent decides -->
  <div id="past-booking-modal" class="modal-overlay" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">Past booking</h3>
        <button id="past-booking-close" type="button" class="modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <p>The experience time for this booking has already passed.</p>
      </div>
      <div class="modal-actions">
        <button id="past-booking-cancel" type="button" class="btn btn-outline">Cancel</button>
        <button id="past-booking-proceed" type="button" class="btn btn-primary">Proceed with booking</button>
      </div>
    </div>
  </div>

  <!-- Sticky top chrome: stays pinned while ticket-details/footer scroll beneath it -->
  <div class="app-chrome">
    <!-- Header -->
    <header class="app-header">
      <div class="header-logo">
        <div>
          <div class="header-title">Booking Assistant</div>
          <div class="header-sub">Box Office Tool</div>
        </div>
      </div>
      <div class="header-actions">
        <span id="auth-status" class="auth-pill auth-pill--checking">checking…</span>
        <button id="theme-toggle" class="theme-switch" role="switch" aria-checked="false" title="Toggle light/dark mode">
          <span class="theme-switch-thumb">&#9728;&#65039;</span>
        </button>
      </div>
    </header>

    <!-- Search Bar -->
    <div class="search-bar">
      <input type="text" id="booking-id" placeholder="Booking ID&hellip;" inputmode="numeric" autocomplete="off" spellcheck="false" disabled />
      <div class="btn-row">
        <button id="search-btn" class="btn btn-primary" disabled>&#10227; Fetch</button>
        <button id="clear-btn" class="btn btn-danger">&#10005; Clear</button>
      </div>
    </div>

    <!-- Automation modal warning -->
    <div id="automation-modal-banner" class="automation-modal-banner" hidden></div>

    <!-- Auth warning banner -->
    <div id="auth-warning" class="bms-warning" hidden>
      <span id="auth-warning-text"></span>
      <button id="recheck-btn" class="recheck-inline-btn">Re-check</button>
    </div>

    <!-- Loading -->
    <div id="loading-spinner" class="spinner-wrap hidden">
      <div class="spinner"></div>
      <p class="spinner-label">Fetching ticket&hellip;</p>
    </div>

    <!-- Error -->
    <div id="error-message" class="error-box hidden"></div>

    <!-- Booking Summary -->
    <div id="booking-summary" class="booking-summary-bar" hidden>
      <div id="bs-tour" class="bs-tour na">&mdash;</div>
      <div class="bs-facts">
        <div class="bs-fact">
          <span class="bs-fact-label">Booking ID</span>
          <span id="bs-id" class="bs-fact-value na">&mdash;</span>
        </div>
        <div class="bs-fact">
          <span class="bs-fact-label">Status</span>
          <span id="bs-status" class="bs-fact-value na">&mdash;</span>
        </div>
        <div class="bs-fact">
          <span class="bs-fact-label">Date</span>
          <span id="bs-date" class="bs-fact-value na">&mdash;</span>
        </div>
        <div class="bs-fact">
          <span class="bs-fact-label">Pax</span>
          <span id="bs-pax" class="bs-fact-value na">&mdash;</span>
        </div>
      </div>
    </div>

    <!-- Tab Nav -->
    <nav id="tab-nav" class="tab-nav" hidden>
      <button class="tab-pill active" data-tab="full-booking">&#128203; Booking</button>
      <button class="tab-pill" data-tab="instructions">&#128204; Instructions</button>
      <button class="tab-pill" data-tab="customer-details">&#128100; Customer</button>
      <button class="tab-pill" data-tab="verify">&#10003; Verify</button>
      <button class="tab-pill" data-tab="late-confirm" hidden>&#128681; Late Confirm</button>
    </nav>
  </div>

  <!-- Ticket Content — sizes to its content; scroll the page to reach it and the footer below -->
  <div id="ticket-details"></div>

  <!-- Footer: sits right after content, not pinned — no dead gap on short bookings,
       reachable by scrolling to the end on long ones -->
  <footer id="app-footer" class="app-footer">
    <p class="footer-text">
      Have suggestions? Fill this <a href="https://docs.google.com/forms/d/e/1FAIpQLSdzGd6m2PnxfMxuD34dEH4WOY9HQSJSAilaZX4PXeA325RmqA/viewform?usp=header" target="_blank" rel="noopener noreferrer" class="footer-link">form</a>.
    </p>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
