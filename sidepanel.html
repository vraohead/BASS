<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BASS - Booking Assistant</title>
  <link rel="stylesheet" href="sidebar.css" />
</head>
<body>

  <!-- ── Header ── -->
  <header class="app-header">
    <div class="header-logo">
      <div class="logo-icon">✦</div>
      <div>
        <div class="header-title">BASS</div>
        <div class="header-sub">Booking Assistant</div>
      </div>
    </div>
    <div class="header-actions">
      <a id="header-bms-link" class="header-bms-link" target="_blank" rel="noopener">BMS ↗</a>
      <button id="theme-toggle" class="theme-toggle" title="Toggle light/dark mode">☀️</button>
    </div>
  </header>

  <!-- ── Search Bar ── -->
  <div class="search-bar">
    <input type="text" id="ticket-input" placeholder="Enter Booking ID…" autocomplete="off" spellcheck="false" />
    <div class="btn-row">
      <button id="fetch-ticket" class="btn btn-primary">⟳ Fetch</button>
      <button id="clear-ticket" class="btn btn-danger">✕ Clear</button>
    </div>
  </div>

  <!-- ── Loading ── -->
  <div id="loading-spinner" class="spinner-wrap hidden">
    <div class="spinner"></div>
    <p class="spinner-label">Fetching ticket…</p>
  </div>

  <!-- ── Error ── -->
  <div id="error-message" class="error-box hidden"></div>

  <!-- ── Date/Time Bar ── -->
  <div id="datetime-bar" class="datetime-bar hidden"></div>

  <!-- ── BMS Tab Mismatch Warning ── -->
  <div id="bms-warning" class="bms-warning hidden"></div>

  <!-- ── Booking Start-Time Validator Warning ── -->
  <div id="dt-warning" class="dt-warning hidden"></div>

  <!-- ── Ticket Content ── -->
  <div id="ticket-details"></div>

  <!-- ── Footer: Feedback & Support ── -->
  <footer class="app-footer">
    <p class="footer-text">
      Have suggestions or improvements? Please reach out to <span class="footer-highlight">Arjun</span> or <span class="footer-highlight">Vivek</span>, or fill this <a href="https://docs.google.com/forms/d/e/1FAIpQLSdzGd6m2PnxfMxuD34dEH4WOY9HQSJSAilaZX4PXeA325RmqA/viewform?usp=header" target="_blank" rel="noopener noreferrer" class="footer-link">form</a>.
    </p>
  </footer>

  <script src="parser.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
