name = "bass-verify"
main = "worker.js"
compatibility_date = "2024-09-23"

# Daily code Slack post — same schedule as configured in the Dashboard
# under Settings -> Triggers -> Cron Triggers ("35 18 * * *" = 00:05 IST).
[triggers]
crons = ["35 18 * * *"]

# Release-control config (LATEST_VERSION, UPDATE_REQUIRED), read/written by
# the admin page at Worker root ("/"). This is the "Booking Assistant" KV
# namespace bound to this Worker as CONFIG.
[[kv_namespaces]]
binding = "CONFIG"
id = "81fab074760c4400b8ce1a1b45ad0745"
