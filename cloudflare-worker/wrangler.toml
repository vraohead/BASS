# ⚠️ INCIDENT (2026-09-14): connecting this repo to Cloudflare Workers
# Builds (Git-based auto-deploy) wiped all Secrets that had been set by
# hand via the Dashboard (SLACK_BOT_TOKEN, OPENAI_API_KEY, ADMIN_PASSWORD,
# DAILY_CODE_SECRET, ADMIN_MASTER_CODE) on the very first CI-driven
# `wrangler deploy`. Secrets are never declared here (by design — this
# file is committed to git), so they must be re-added via Dashboard ->
# Settings -> Variables and Secrets after ANY incident like this.
# Before trusting Git-based deploys again: re-add every secret, push one
# trivial change, and confirm in /debug-env that hasSlackToken/
# hasOpenAiKey/hasAdminPassword/hasDailyCodeSecret are all still true
# afterward (ADMIN_MASTER_CODE itself is retired — see the codes section
# below the endpoints list up top; no need to re-add it). If a deploy ever
# wipes secrets again, disconnect Builds (Settings -> Builds -> Disconnect)
# and go back to pasting worker.js into the Dashboard's "Edit code" flow —
# that path never touches secrets at all.
name = "bass-verify"
main = "worker.js"
compatibility_date = "2024-09-23"

# Daily code Slack post — same schedule as configured in the Dashboard
# under Settings -> Triggers -> Cron Triggers ("35 18 * * *" = 00:05 IST).
[triggers]
crons = ["35 18 * * *"]

# Instructions-unlock and admin codes are stored here (see worker.js's
# header comment for the code system). This is the "Booking Assistant" KV
# namespace bound to this Worker as CONFIG.
[[kv_namespaces]]
binding = "CONFIG"
id = "81fab074760c4400b8ce1a1b45ad0745"

# Non-secret config. SHEETS_SYNC_URL is the Apps Script /exec endpoint — not
# sensitive on its own (writes are gated by SHEETS_SYNC_SECRET), but keeping it
# here makes it easy to change without touching worker.js.
#
# ALLOWED_EXTENSION_ORIGIN locks CORS on /verify, /confirm-flag, /record-fetch,
# and /verify-code to the extension's own origin instead of '*'. Set it to
# "chrome-extension://<published-extension-id>" once the Chrome Web Store
# listing exists (Developer Dashboard -> Items -> the extension's ID in the
# URL/detail page). Left unset, those routes fall back to '*' (today's
# behavior) so nothing breaks before the ID exists — but the real gate on
# those routes is EXTENSION_SHARED_SECRET below, which is required either way.
[vars]
SHEETS_SYNC_URL = "https://script.google.com/macros/s/AKfycbybEfWQtPTQhOkJ2q-tWL_VDYdPOIo5-CYP3VRVbQ8Hz7QzRW-4uB9-9Qr_BNaXrRea0A/exec"
# ALLOWED_EXTENSION_ORIGIN = "chrome-extension://REPLACE_WITH_PUBLISHED_EXTENSION_ID"

# Secrets (set via `wrangler secret put <NAME>` or Dashboard -> Settings ->
# Variables and Secrets — never declared here, since this file is committed):
#   ADMIN_PASSWORD          - gates all /admin/* endpoints
#   OPENAI_API_KEY          - AI Verify's vision calls
#   SLACK_BOT_TOKEN         - posting to the Confirm & Flag channel
#   SHEETS_SYNC_SECRET      - must match SHARED_SECRET in apps-script/dashboard-sync.gs
#   EXTENSION_SHARED_SECRET - must match EXTENSION_SHARED_SECRET in
#                             extension/background/service-worker.js; gates
#                             /verify, /confirm-flag, /record-fetch, /verify-code
#                             (generate with: openssl rand -hex 32)
